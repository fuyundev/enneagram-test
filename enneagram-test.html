<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="54 题九型人格快速测试，答完即出九型得分、主型与翼型，可复制或下载结果；数据仅保存在本地，不上传服务器。" />
  <meta name="theme-color" content="#5b5bd6" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="九型人格快速测试" />
  <meta property="og:description" content="54 题，答完即出九型得分、主型与翼型。数据仅保存在本地，不上传服务器。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%80%3C/text%3E%3C/svg%3E" />
  <title>九型人格快速测试</title>
  <style>
    :root { --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --brand:#5b5bd6; --brand2:#7c3aed; --soft:#f5f5ff; --danger:#dc2626; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:linear-gradient(135deg,#f7f7ff,#fff 45%,#f5f8ff); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .wrap { max-width:900px; margin:0 auto; padding:28px 16px 60px; }
    header { background:rgba(255,255,255,.88); border:1px solid var(--line); border-radius:22px; padding:24px; box-shadow:0 12px 35px rgba(64,64,130,.08); position:sticky; top:10px; z-index:5; backdrop-filter:blur(10px); overflow-anchor:none; }
    h1 { margin:0 0 8px; font-size:clamp(24px,5vw,34px); letter-spacing:.02em; }
    .sub { color:var(--muted); line-height:1.6; margin:0; }
    /* 向下滚动后头部收起，少占屏幕空间；JS 补齐高度差，保证文档流不变、不触发滚动锚定 */
    header.compact { padding:12px 24px; }
    header.compact h1 { font-size:20px; margin-bottom:0; }
    header.compact .sub { display:none; }
    header.compact .bar { margin-top:10px; height:6px; }
    header.compact .status { margin-top:6px; font-size:13px; }
    .bar { height:9px; background:#ececf8; border-radius:99px; overflow:hidden; margin-top:18px; }
    #progress { height:100%; width:0; background:linear-gradient(90deg,var(--brand),var(--brand2)); transition:width .25s; }
    .status { display:flex; justify-content:space-between; gap:12px; margin-top:9px; color:var(--muted); font-size:14px; }
    .question { background:#fff; border:1px solid var(--line); border-radius:18px; padding:20px; margin:16px 0; box-shadow:0 5px 18px rgba(31,41,55,.04); scroll-margin-top:120px; transition:border-color .2s, box-shadow .2s; }
    .question.missing { border-color:var(--danger); box-shadow:0 0 0 3px rgba(220,38,38,.12); }
    .question.missing .qtext::after { content:"未作答"; color:var(--danger); font-size:12px; font-weight:600; margin-left:8px; vertical-align:middle; }
    .qtext { font-size:17px; line-height:1.65; margin:0 0 15px; }
    .num { color:var(--brand); font-weight:700; margin-right:7px; }
    fieldset.options { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; border:0; padding:0; margin:0; min-width:0; }
    .options label { cursor:pointer; text-align:center; border:1px solid #d9daf0; border-radius:12px; padding:11px 5px 9px; background:#fafaff; transition:.15s; user-select:none; position:relative; }
    .options label:hover { border-color:var(--brand); transform:translateY(-1px); }
    .options label:has(input:checked) { border-color:var(--brand); background:#fff; }
    .options label:has(input:focus-visible) { outline:2px solid var(--brand2); outline-offset:2px; }
    .options input { position:absolute; opacity:0; pointer-events:none; }
    .options input:checked + span { background:var(--brand); color:#fff; box-shadow:0 5px 12px rgba(91,91,214,.25); }
    .options span { display:block; border-radius:8px; padding:7px 3px; font-weight:700; font-size:18px; }
    .options small { display:block; color:var(--muted); font-size:11px; margin-top:5px; }
    .options input:checked + span + small { color:var(--brand); font-weight:600; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
    .export-box { display:flex; flex-direction:column; gap:12px; margin-top:18px; padding:14px 16px; background:#f8f8ff; border:1px solid #e5e5fa; border-radius:14px; }
    .export-row { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
    .export-label { color:var(--muted); font-size:13px; font-weight:600; }
    .segmented { display:inline-flex; background:#e9e9fb; border-radius:11px; padding:3px; gap:2px; }
    .segmented button { background:transparent; color:#5a5a9a; border-radius:9px; padding:8px 14px; font-size:14px; font-weight:600; }
    .segmented button.on { background:#fff; color:#3737a1; box-shadow:0 2px 6px rgba(91,91,214,.18); }
    .dl-group { display:inline-flex; flex-wrap:wrap; gap:6px; }
    button.small { padding:9px 13px; font-size:13px; border-radius:10px; }
    .export-row .primary { margin-right:6px; }
    button { border:0; border-radius:12px; padding:13px 18px; font-size:15px; cursor:pointer; font-weight:700; font-family:inherit; }
    button:focus-visible { outline:2px solid var(--brand2); outline-offset:2px; }
    .primary { background:linear-gradient(90deg,var(--brand),var(--brand2)); color:#fff; }
    .secondary { background:#eef0ff; color:#4646a8; }
    .result { display:none; background:#fff; border:1px solid #dcdcff; border-radius:20px; padding:22px; margin-top:22px; box-shadow:0 10px 28px rgba(91,91,214,.12); scroll-margin-top:120px; }
    .result h2 { margin:0 0 6px; }
    .hint { color:var(--muted); font-size:14px; line-height:1.6; }
    .highlight { background:linear-gradient(135deg,#f5f5ff,#f3e8ff); border:1px solid #e0d7ff; border-radius:16px; padding:16px 18px; margin:16px 0; }
    .highlight .label { color:var(--muted); font-size:13px; }
    .highlight .type { font-size:22px; font-weight:800; color:#3737a1; margin:2px 0 6px; }
    .highlight .desc { margin:0; line-height:1.7; font-size:14.5px; }
    .highlight .wing { color:var(--muted); font-size:13px; margin-top:8px; }
    .ranking { display:flex; flex-direction:column; gap:9px; margin:16px 0 4px; }
    .row { display:grid; grid-template-columns:110px 1fr 56px; align-items:center; gap:10px; font-size:14px; }
    .row .name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .row .track { height:14px; background:#ececf8; border-radius:99px; overflow:hidden; }
    .row .fill { height:100%; width:0; background:linear-gradient(90deg,var(--brand),var(--brand2)); border-radius:99px; transition:width .6s ease; }
    .row.best .fill { background:linear-gradient(90deg,#f59e0b,#f97316); }
    .row .val { text-align:right; font-weight:700; color:#3737a1; font-variant-numeric:tabular-nums; }
    .top { text-align:center; margin:18px 0 0; }
    .top a { color:var(--brand); cursor:pointer; font-size:14px; }
    footer { text-align:center; color:#9ca3af; font-size:12px; margin-top:28px; letter-spacing:.04em; }
    #toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); background:rgba(31,41,55,.94); color:#fff; padding:11px 18px; border-radius:12px; font-size:14px; opacity:0; pointer-events:none; transition:.25s; z-index:20; max-width:calc(100% - 32px); text-align:center; }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    #toast.error { background:rgba(185,28,28,.95); }
    #toast a { color:#c7d2fe; font-weight:700; margin-left:10px; text-decoration:underline; cursor:pointer; }
    #toast.actionable { pointer-events:auto; }
    #fab { position:fixed; right:18px; bottom:22px; z-index:15; display:none; padding:10px 14px; border-radius:99px; background:rgba(255,255,255,.92); color:#3737a1; border:1px solid #dcdcff; box-shadow:0 8px 24px rgba(91,91,214,.18); font-size:13px; font-weight:700; backdrop-filter:blur(8px); }
    #fab.show { display:block; }
    .wechat-note { display:none; color:#9a3412; background:#fff7ed; border:1px solid #fed7aa; border-radius:10px; padding:8px 12px; font-size:13px; line-height:1.6; }
    body.wechat .dl-group { display:none; }
    body.wechat .wechat-note { display:block; }
    @media (max-width:560px) {
      header { padding:18px; top:5px; }
      header.compact { padding:10px 18px; }
      header.compact h1 { font-size:17px; }
      header.compact .status span:last-child { display:none; }
      .question, .result { scroll-margin-top:100px; }
      .question { padding:16px; }
      .options { gap:5px; }
      .options label { padding:8px 2px 6px; }
      .options span { font-size:16px; }
      .options small { font-size:10px; }
      .row { grid-template-columns:86px 1fr 46px; font-size:13px; }
      #toast { bottom:78px; }
      #fab { right:14px; bottom:18px; }
    }
    @media (max-width:360px) { .options label { padding:8px 1px 6px; } .options small { font-size:9px; letter-spacing:-.02em; } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } .row .fill, .options label { transition:none; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header id="header">
      <h1>九型人格快速测试</h1>
      <p class="sub">共 54 题，请按直觉选择最符合你平时状态的程度。答完后可复制或下载结果。所有答案与结果仅保存在你的浏览器本地，不会上传到任何服务器。</p>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="54" aria-valuenow="0" id="progressbar"><div id="progress"></div></div>
      <div class="status"><span id="count">已完成 0 / 54</span><span>1 = 完全不符合　5 = 完全符合</span></div>
    </header>

    <section id="questions" aria-label="题目列表"></section>
    <div class="actions">
      <button class="primary" id="finish">完成并生成结果</button>
      <button class="secondary" id="clear">清空重答</button>
    </div>
    <section class="result" id="result" aria-live="polite">
      <h2>你的答题结果</h2>
      <p class="hint">以下是按每 6 题汇总的分数（每型 6～30 分），仅用于完成这份测试，不等同于专业心理评估。</p>
      <div class="highlight" id="highlight"></div>
      <div class="ranking" id="ranking"></div>
      <textarea id="summary" hidden readonly aria-hidden="true" tabindex="-1"></textarea>
      <div class="export-box">
        <div class="export-row">
          <span class="export-label">内容</span>
          <div class="segmented" role="radiogroup" aria-label="导出内容" id="exportMode">
            <button type="button" class="on" data-mode="details" role="radio" aria-checked="true">逐题结果</button>
            <button type="button" data-mode="summary" role="radio" aria-checked="false">汇总结果</button>
          </div>
        </div>
        <div class="export-row">
          <button class="primary" id="copy">复制文本</button>
          <div class="dl-group">
            <button class="secondary small" data-format="txt">下载 TXT</button>
            <button class="secondary small" data-format="csv">下载 CSV</button>
            <button class="secondary small" data-format="json">下载 JSON</button>
          </div>
          <div class="wechat-note">微信内置浏览器不支持下载文件，请使用「复制文本」，或点右上角「在浏览器中打开」后再下载。</div>
        </div>
      </div>
    </section>
    <div class="top"><a id="toplink" href="#top">回到顶部</a></div>
    <footer>Made by fuyundev</footer>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <button id="fab" type="button" aria-label="页面导航"></button>
<script>
const questions = [
"我总是注意到别人的错误，并向他直接指出来。","大家觉得我总是一脸严肃，表情生硬。","我力求尽善尽美，常常反思不足、自我批评、努力改进。","我期望一切井然有序，无法对明知的错误或混乱视而不见。","大家觉得我应该放松点，多一点人情味。","只有每个步骤及细节都做对了，结果才会正确。","帮不到别人的时候我感到特别难受。","我高兴帮助别人，却不习惯需要别人的帮助。","我时常为别人的事四处跑，忙得不亦乐乎。","当没有为别人的事而忙碌时，我会感到寂寞。","大家很乐意向我诉说他们的困难。","我会基于同情心站在朋友一边，即使他们犯错了。","我不觉得向别人展示自己的成功有什么难为情的。","我喜欢当主角，受到众人的关注。","我能轻易说服别人。","我办事效率高，能迅速模仿别人快捷的办法。","我精力充沛，喜欢不断追求更多的成功。","不管什么场合，人们都能看到我最棒的一面。","我特别能感受悲伤，有时甚至享受这种感觉。","我缺少很多别人拥有的东西。","我常常有被遗弃的感觉。","初见我的人觉得我表现冷漠而高傲。","我常常不知道自己下一刻想要什么。","我常在同一天内感受到喜怒哀乐的变化。","探索自然的奥秘，我感到其乐无穷。","我很少主动去接近别人。","我很少快速做出判断，而需要周密地考虑。","要在众人面前表现自己会使我不自在甚至有点怯场。","独自在宽敞的资料室收集各种信息，是一种享受。","我特别需要独处的时间。","我总是设想最坏的结果，然后陷入苦恼之中。","我常常试探或考验朋友的忠诚。","所有罪名中，让我最厌恶的是欺骗。","我有时自信自己掌握了权威，有时却想依赖别人的决定。","上司最看重我尽忠职守，朋友也觉得我忠诚可靠。","面对威胁，我一时焦急忧虑，一时激烈反抗。","我很在意自己是否依然年轻有活力，常担心自由被剥夺。","我时常发现新开张的美食店，最新的服装款式，或新兴的游乐节目。","我觉得有很多新鲜有趣的事情，人生真是好玩又快乐。","我总是有许多新鲜有趣的计划，时间怎么也不够用。","我只喜欢与有趣的人为友，对一些闷蛋却懒得交往，即使他们看来很有深度。","我很少用心去听别人的心情，只喜欢说说俏皮话和笑话。","我看不起那些软弱的人。","我享受掌握权力的感觉，喜欢迎接挑战。","对那些行为过分的人，我一定好好教训他们。","我敢于与人正面交锋，不害怕冲突。","我总是禁不住要支持弱小的一方。","我说了许多别人想说又没胆量说的话。","面对问题，我经常想“时间总是有的，改天再说吧”。","我对朋友或家人很少表达反对意见。","我常常不清楚自己有什么需要。","我不要求获得任何关注。","我特别容易认同别人的想法和做法。","面对别人无理的指责，我常常只是沉默不想说话。"
];
const types = ["1号 完美型","2号 助人型","3号 成就型","4号 自我型","5号 理智型","6号 忠诚型","7号 活跃型","8号 领袖型","9号 和平型"];
const descs = [
  "追求正确与秩序，原则性强、自律负责，习惯反思与改进，但容易对自己和他人过于苛刻。",
  "热情体贴、乐于付出，重视人际关系，善于察觉他人需要，却常常忽略自己的感受。",
  "目标导向、高效务实，重视成果与形象，适应力强，有时会把自我价值绑在成就上。",
  "情感细腻、追求独特与真实，富有审美与创造力，情绪起伏较大，容易感到与众不同或被误解。",
  "好奇求知、独立冷静，喜欢观察与思考，重视私人空间，倾向先想清楚再行动。",
  "谨慎负责、忠诚可靠，善于预见风险、未雨绸缪，但容易焦虑和反复怀疑。",
  "乐观开朗、热爱新鲜与自由，兴趣广泛、点子多，害怕被束缚，有时难以坚持到底。",
  "果断有力、敢于担当，直面冲突、保护弱小，掌控欲较强，不喜欢示弱。",
  "随和包容、善于调解，追求和谐与安稳，容易顺从他人、回避冲突，有时会拖延。"
];
const LABELS = { 1:'完全不符合', 2:'较不符合', 3:'一般', 4:'较符合', 5:'完全符合' };
const STORAGE_KEY = 'enneagramAnswers';
const N = questions.length;
let latestSums = [];
let toastTimer;

const $ = id => document.getElementById(id);
const store = { // 隐私模式等场景下 localStorage 可能抛错，静默降级
  get(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); }catch(e){ return {}; } },
  set(v){ try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(v)); }catch(e){} },
  clear(){ try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} }
};
const root = $('questions');
questions.forEach((q,i)=>{
  const n=i+1; const el=document.createElement('article'); el.className='question'; el.id='q'+n;
  el.innerHTML=`<p class="qtext" id="qt${n}"><span class="num">${n}.</span>${q}</p><fieldset class="options" aria-labelledby="qt${n}">${[1,2,3,4,5].map(v=>`<label><input type="radio" name="q${n}" value="${v}" aria-label="${v} ${LABELS[v]}"><span>${v}</span><small>${LABELS[v]}</small></label>`).join('')}</fieldset>`;
  root.appendChild(el);
});

function labelFor(v){ return LABELS[Number(v)] || ''; }
function toast(msg, isError, action){
  const t=$('toast'); t.textContent=msg; t.classList.toggle('error',!!isError); t.classList.toggle('actionable',!!action);
  if(action){ const a=document.createElement('a'); a.textContent=action.label; a.onclick=()=>{ action.fn(); t.classList.remove('show'); }; t.appendChild(a); }
  t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), action?5000:2200);
}
function answerOf(i){ const el=document.querySelector(`input[name=q${i+1}]:checked`); return el?Number(el.value):0; }
function allAnswers(){ return questions.map((_,i)=>answerOf(i)); }
function checkedInputs(){ return document.querySelectorAll('#questions input:checked'); }

function update(){
  const answered=checkedInputs().length;
  $('count').textContent=`已完成 ${answered} / ${N}`;
  $('progress').style.width=(answered/N*100)+'%';
  $('progressbar').setAttribute('aria-valuenow',answered);
  const saved={}; checkedInputs().forEach(x=>saved[x.name]=x.value); store.set(saved);
}

root.addEventListener('change',e=>{
  if(!(e.target instanceof HTMLInputElement)) return;
  update();
  const card=e.target.closest('.question'); card.classList.remove('missing');
  // 若结果已展示，实时重算；否则自动滚到下一道未答题
  if($('result').style.display==='block'){ renderResult(); return; }
  let next=card.nextElementSibling;
  while(next && next.querySelector('input:checked')) next=next.nextElementSibling;
  if(next) setTimeout(()=>next.scrollIntoView({behavior:'smooth',block:'center'}),120);
});

function computeSums(vals){ const sums=Array(9).fill(0); vals.forEach((v,i)=>sums[Math.floor(i/6)]+=v); return sums; }
function analyze(sums){
  const max=Math.max(...sums);
  const tops=sums.map((s,i)=>s===max?i:-1).filter(i=>i>=0);
  const order=sums.map((s,i)=>i).sort((a,b)=>sums[b]-sums[a]||a-b);
  let wing=null;
  if(tops.length===1){ const t=tops[0], l=(t+8)%9, r=(t+1)%9; if(sums[l]!==sums[r]) wing=sums[l]>sums[r]?l:r; }
  return { max, tops, order, wing };
}
function summaryText(sums){
  const { max, tops, order, wing } = analyze(sums);
  const lines=['九型人格测试结果','',...order.map((i,k)=>`${k+1}. ${types[i]}：${sums[i]} 分`),'',`最高分：${tops.map(i=>types[i]).join('、')}（${max} 分）`];
  if(wing!==null) lines.push(`可能的翼型：${types[wing]}`);
  return lines.join('\n');
}
function renderResult(){
  const vals=allAnswers(); if(vals.some(v=>!v)) return;
  const sums=computeSums(vals); latestSums=sums;
  const { max, tops, order, wing } = analyze(sums);
  $('highlight').innerHTML = tops.length===1
    ? `<div class="label">你的主要类型倾向</div><div class="type">${types[tops[0]]}</div><p class="desc">${descs[tops[0]]}</p>${wing!==null?`<div class="wing">可能的翼型：${types[wing]}（${sums[wing]} 分）</div>`:''}`
    : `<div class="label">最高分并列，你可能同时具有以下倾向</div><div class="type">${tops.map(i=>types[i]).join(' / ')}</div>${tops.map(i=>`<p class="desc"><b>${types[i]}</b>：${descs[i]}</p>`).join('')}`;
  const prev={}; document.querySelectorAll('.row').forEach(r=>prev[r.dataset.t]=r.querySelector('.fill').style.width);
  $('ranking').innerHTML = order.map(i=>`<div class="row${sums[i]===max?' best':''}" data-t="${i}"><span class="name">${types[i]}</span><div class="track"><div class="fill" style="width:${prev[i]||'0%'}" data-w="${(sums[i]/30*100).toFixed(1)}"></div></div><span class="val">${sums[i]} 分</span></div>`).join('');
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.row .fill').forEach(f=>f.style.width=f.dataset.w+'%')));
  $('summary').value=summaryText(sums);
  $('result').style.display='block';
  updateFab();
}

$('finish').onclick=()=>{
  const vals=allAnswers();
  document.querySelectorAll('.question.missing').forEach(q=>q.classList.remove('missing'));
  const missing=vals.map((v,i)=>v?-1:i).filter(i=>i>=0);
  if(missing.length){
    missing.forEach(i=>$('q'+(i+1)).classList.add('missing'));
    $('q'+(missing[0]+1)).scrollIntoView({behavior:'smooth',block:'center'});
    toast(`还有 ${missing.length} 题未作答，已为你标出，请完成后再生成结果。`, true);
    return;
  }
  renderResult();
  $('result').scrollIntoView({behavior:'smooth'});
};

async function copyText(text, okMsg){
  try{ await navigator.clipboard.writeText(text); toast(okMsg); }
  catch(e){ const t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); const ok=document.execCommand('copy'); t.remove(); toast(ok?okMsg:'复制失败，请手动选择文本复制。', !ok); }
}
let exportMode='details';
$('exportMode').addEventListener('click',e=>{ const b=e.target.closest('button[data-mode]'); if(!b) return; exportMode=b.dataset.mode; $('exportMode').querySelectorAll('button').forEach(x=>{ const on=x===b; x.classList.toggle('on',on); x.setAttribute('aria-checked',on); }); });
$('copy').onclick=()=>copyText(exportMode==='summary'?$('summary').value:detailText(), exportMode==='summary'?'汇总结果已复制到剪贴板。':'逐题结果已复制到剪贴板。');
function detailText(){ const vals=allAnswers(); return ['九型人格测试逐题结果',...questions.map((q,i)=>`${i+1}. ${q}\n   我的选择：${vals[i]}（${labelFor(vals[i])}）`),'——————————',summaryText(computeSums(vals))].join('\n\n'); }

function csv(rows){ return rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'); }
function exportContent(format){
  const mode=exportMode; const vals=allAnswers();
  if(format==='txt') return mode==='summary'?$('summary').value:detailText();
  if(mode==='summary'){
    if(format==='json') return JSON.stringify({title:'九型人格测试结果',scores:types.map((type,i)=>({type,score:latestSums[i]}))},null,2);
    return csv([['类型','分数'],...types.map((type,i)=>[type,latestSums[i]])]);
  }
  if(format==='json') return JSON.stringify({title:'九型人格测试逐题结果',answers:questions.map((q,i)=>({questionNo:i+1,question:q,score:vals[i],label:labelFor(vals[i])})),scores:types.map((type,i)=>({type,score:latestSums[i]}))},null,2);
  return csv([['题号','题目','分数','选项'],...questions.map((q,i)=>[i+1,q,vals[i],labelFor(vals[i])])]);
}
document.querySelector('.dl-group').addEventListener('click',e=>{
  const b=e.target.closest('button[data-format]'); if(!b) return;
  const format=b.dataset.format, ext=format, mode=exportMode;
  const mime=format==='json'?'application/json;charset=utf-8':format==='csv'?'text/csv;charset=utf-8':'text/plain;charset=utf-8';
  const content=(format==='csv'?'\uFEFF':'')+exportContent(format); // CSV 加 BOM，Excel 打开不乱码
  const blob=new Blob([content],{type:mime}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  const d=new Date(), stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  a.download=`九型人格测试结果${mode==='details'?'_逐题':''}_${stamp}.${ext}`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast(`${format.toUpperCase()} 文件已开始下载。`);
});

$('clear').onclick=()=>{
  if(!confirm('确定要清空所有答案并重新开始吗？')) return;
  checkedInputs().forEach(x=>x.checked=false);
  document.querySelectorAll('.question.missing').forEach(q=>q.classList.remove('missing'));
  $('result').style.display='none'; update(); store.clear(); updateFab();
  window.scrollTo({top:0,behavior:'smooth'}); toast('已清空，可以重新开始作答。');
};
$('toplink').onclick=e=>{ e.preventDefault(); window.scrollTo({top:0,behavior:'smooth'}); };

// 向下滚动时收起头部。关键：收起后补齐高度差，让头部占据的文档流高度不变，
// 否则浏览器的滚动锚定会把 scrollY 拉回阈值以下，造成展开/收起来回抖动。
const header=$('header');
let expandedH=0;
// 补偿量放在下一个元素的 padding-top 上（margin 会和题目卡片的 margin 折叠，导致补不齐）
const questionsEl=$('questions');
let compactH=0;
function measureHeader(){
  const was=header.classList.contains('compact');
  header.classList.remove('compact'); questionsEl.style.paddingTop=''; expandedH=header.offsetHeight;
  header.classList.add('compact'); compactH=header.offsetHeight;
  header.classList.toggle('compact',was); if(was) questionsEl.style.paddingTop=Math.max(0,expandedH-compactH)+'px';
}
function applyHeader(){
  const want=window.scrollY>expandedH;
  if(want===header.classList.contains('compact')) return;
  // 同一帧内一起改，中间不读布局，避免出现「先缩后补」的中间态触发滚动锚定
  header.classList.toggle('compact',want);
  questionsEl.style.paddingTop = want ? Math.max(0,expandedH-compactH)+'px' : '';
}
measureHeader();
// 浮动按钮：有结果且结果在视口下方 → 「查看结果」，否则滚得够远 → 「回到顶部」
function updateFab(){
  const fab=$('fab'); const res=$('result');
  const resultShown=res.style.display==='block';
  const resultBelow=resultShown && res.getBoundingClientRect().top>innerHeight;
  if(resultBelow){ fab.textContent='查看结果 ↓'; fab.dataset.act='result'; fab.classList.add('show'); }
  else if(window.scrollY>innerHeight){ fab.textContent='回到顶部 ↑'; fab.dataset.act='top'; fab.classList.add('show'); }
  else fab.classList.remove('show');
}
$('fab').onclick=()=>{ if($('fab').dataset.act==='result') $('result').scrollIntoView({behavior:'smooth'}); else window.scrollTo({top:0,behavior:'smooth'}); };
let ticking=false;
window.addEventListener('scroll',()=>{ if(ticking) return; ticking=true; requestAnimationFrame(()=>{ applyHeader(); updateFab(); ticking=false; }); },{passive:true});
let resizeTimer; window.addEventListener('resize',()=>{ clearTimeout(resizeTimer); resizeTimer=setTimeout(()=>{ measureHeader(); applyHeader(); updateFab(); },150); });
if(/MicroMessenger/i.test(navigator.userAgent)) document.body.classList.add('wechat');

// 初始化：恢复本机保存的进度
(function init(){
  Object.entries(store.get()).forEach(([name,value])=>{ const input=document.querySelector(`input[name="${name}"][value="${value}"]`); if(input) input.checked=true; });
  update();
  const answered=checkedInputs().length;
  if(answered===N){ renderResult(); toast('已恢复你上次的答题结果。', false, {label:'查看结果', fn:()=>$('result').scrollIntoView({behavior:'smooth'})}); }
  else if(answered>0){ toast(`已恢复上次进度：${answered} / ${N} 题。`); }
  applyHeader(); updateFab();
})();
</script>
</body>
